<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hackathon Frontend</title>
    <link rel="stylesheet" href="css/style.css" type="text/css"/>
</head>
<body>
    <div id="main">
        <div id="prompt">
            <textarea name="" id="prompt-area"></textarea>
            <button id="send-prompt"></button>
            <textarea id="response-area" disabled></textarea>
        </div>
        <div id="verify">
            <input type="text" id="verify-input"/>
            <button id="verify-btn"></button>
            <div id="verify-result"></div>
        </div>
    </div> 
    <script src="js/script.js" type="module"></script>
</body>
</html>
